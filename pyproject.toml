[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelvision"
version = "0.1.0"
description = "Workplace safety intelligence platform: binds every PPE observation to a tracked worker and produces a tamper-evident audit trail."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["ppe", "safety", "yolov8", "bytetrack", "computer-vision"]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Heavy vision runtime. Phase 1 tests never import it.
vision = ["ultralytics>=8.2"]
runtime = ["onnxruntime>=1.17"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.98",
    "ruff>=0.4",
]

[project.scripts]
sentinelvision = "sentinelvision.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelvision"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" for the package, "." so tests can import benchmarks.evaluate_video.
pythonpath = ["src", "."]
addopts = "-q --cov=sentinelvision --cov-report=term-missing"
