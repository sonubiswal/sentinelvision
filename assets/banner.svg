<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">SentinelVision</title>
  <desc id="d">Animated text banner: SentinelVision, per-worker PPE compliance, over layered moving ocean waves.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1626"/>
      <stop offset="0.55" stop-color="#12306b"/>
      <stop offset="1" stop-color="#2457ff"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6bff" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#2457ff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17c98a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#12a56b" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa2ff" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#2457ff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="w4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9ccff"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="360" rx="22"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>

    <!-- Back wave: long swell (period 1280) -->
    <path fill="url(#w1)" d="M0 232 q320 -90 640 0 t640 0 t640 0 t640 0 V360 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1280 0" dur="26s" repeatCount="indefinite"/>
    </path>
    <!-- Green wave: medium swell, opposite direction (period 960) -->
    <path fill="url(#w2)" d="M0 256 q240 100 480 0 t480 0 t480 0 t480 0 t480 0 V360 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-960 0" to="0 0" dur="18s" repeatCount="indefinite"/>
    </path>
    <!-- Mid wave: tighter swell (period 640) -->
    <path fill="url(#w3)" d="M0 282 q160 -80 320 0 t320 0 t320 0 t320 0 t320 0 t320 0 t320 0 V360 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-640 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <!-- Front wave: foam layer (period 960) -->
    <path fill="url(#w4)" d="M0 312 q240 -64 480 0 t480 0 t480 0 t480 0 t480 0 V360 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-960 0" to="0 0" dur="9s" repeatCount="indefinite"/>
    </path>

    <!-- text only -->
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" text-anchor="middle">
      <text x="640" y="112" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#title)">
        SentinelVision
        <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
      </text>
      <text x="640" y="156" font-size="26" font-weight="500" fill="#d6e2ff">
        Per-worker PPE compliance from the cameras you already own.
        <animate attributeName="opacity" values="0;1" dur="1.8s" fill="freeze"/>
      </text>
    </g>
  </g>

  <rect width="1280" height="360" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.15"/>
</svg>
